name: Publier sur nogues.app/bd-loki-etoile
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-ovh-bd-loki-etoile
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      TARGET_DIR: www/bd-loki-etoile
    steps:
      - name: Vérifier la configuration
        id: check
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::Secrets SFTP absents : publication ignorée."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: Construire le site si nécessaire
        id: build
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "dir=site" >> "$GITHUB_OUTPUT"
          fi
      - name: Installer lftp
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Envoyer en SFTP
        if: steps.check.outputs.ready == 'true'
        env:
          PUBLISH_DIR: ${{ steps.build.outputs.dir }}
        run: |
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20; set net:max-retries 3; set net:reconnect-interval-base 5;
            mkdir -p -f '$TARGET_DIR';
            mirror --reverse --parallel=4 $PUBLISH_DIR/ '$TARGET_DIR';
            bye"
          echo "Publication : $(find $PUBLISH_DIR -type f | wc -l) fichiers dans $TARGET_DIR" >> "$GITHUB_STEP_SUMMARY"
